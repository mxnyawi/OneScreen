[package]
name = "onescreen"
description = "Push your cursor toward a monitor and OneScreen moves it there."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "onescreen"
path = "src/main.rs"

[dependencies]
onescreen-core = { path = "../onescreen-core" }
serde.workspace = true
serde_json.workspace = true
dirs = "7"

# The app runs on macOS and Windows. On other systems only the core builds (see crates/onescreen-core).
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tao = "0.37"
tray-icon = "0.26"
open = "5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSString"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Devices_Display",
  "Win32_Graphics_Gdi",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_UI_HiDpi",
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
