name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

# Read-only token: nothing in CI can push, tag or publish.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup is preinstalled on GitHub's runners: no third-party actions needed
      - run: rustup toolchain install stable --profile minimal -c rustfmt,clippy && rustup default stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p onescreen-core --all-targets -- -D warnings
      - run: cargo test --workspace

  app:
    name: App (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal -c clippy && rustup default stable
      - run: cargo clippy -p onescreen -- -D warnings
      - run: cargo test --workspace
      - name: Build OneScreen.app
        if: runner.os == 'macOS'
        # zip with ditto: upload-artifact drops Unix permissions, which would break the app
        run: |
          ./scripts/bundle-macos.sh
          ditto -c -k --keepParent target/release/bundle/OneScreen.app OneScreen-macOS.zip
      - name: Build onescreen.exe
        if: runner.os == 'Windows'
        run: cargo build --release -p onescreen
      # Run the one-line installers for real against this build: install, launch, uninstall.
      - name: Installer smoke test (macOS)
        if: runner.os == 'macOS'
        env:
          ONESCREEN_ZIP: ${{ github.workspace }}/OneScreen-macOS.zip
        run: |
          bash install.sh
          app=/Applications/OneScreen.app; [ -d "$app" ] || app="$HOME/Applications/OneScreen.app"
          test -x "$app/Contents/MacOS/OneScreen"
          sleep 5
          pgrep -x OneScreen >/dev/null || { echo "OneScreen exited after launch"; exit 1; }
          test -f "$HOME/Library/LaunchAgents/io.github.mxnyawi.onescreen.plist"
          bash install.sh --uninstall
          if pgrep -x OneScreen >/dev/null; then echo "still running after uninstall"; exit 1; fi
          test ! -e "$app"
          test ! -f "$HOME/Library/LaunchAgents/io.github.mxnyawi.onescreen.plist"
      - name: Installer smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/onescreen.exe -DestinationPath OneScreen-Windows.zip -Force
          $env:ONESCREEN_ZIP = Join-Path $PWD 'OneScreen-Windows.zip'
          ./install.ps1
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\OneScreen\onescreen.exe'
          if (-not (Test-Path $exe)) { throw 'onescreen.exe was not installed' }
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('Programs')) 'OneScreen.lnk'))) { throw 'no Start menu shortcut' }
          Start-Sleep -Seconds 5
          if (Get-Process -Name onescreen -ErrorAction SilentlyContinue) { 'OneScreen is running' }
          else { Write-Warning 'OneScreen is not running (hosted runners may have no interactive desktop for tray apps)' }
          ./uninstall.ps1
          if (Test-Path $exe) { throw 'onescreen.exe was not removed' }
      - uses: actions/upload-artifact@v4
        with:
          name: onescreen-${{ runner.os }}
          path: |
            OneScreen-macOS.zip
            target/release/onescreen.exe
          if-no-files-found: error
