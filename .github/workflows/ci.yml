name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p onescreen-core --all-targets -- -D warnings
      - run: cargo test --workspace

  app:
    name: App (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p onescreen -- -D warnings
      - run: cargo test --workspace
      - name: Build OneScreen.app
        if: runner.os == 'macOS'
        # zip with ditto: upload-artifact drops Unix permissions, which would break the app
        run: |
          ./scripts/bundle-macos.sh
          ditto -c -k --keepParent target/release/bundle/OneScreen.app OneScreen-macOS.zip
      - name: Build onescreen.exe
        if: runner.os == 'Windows'
        run: cargo build --release -p onescreen
      - uses: actions/upload-artifact@v4
        with:
          name: onescreen-${{ runner.os }}
          path: |
            OneScreen-macOS.zip
            target/release/onescreen.exe
          if-no-files-found: error
