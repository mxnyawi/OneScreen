# Push a tag like v0.1.0 to build macOS (universal) and Windows downloads and
# attach them to a GitHub Release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - run: ./scripts/bundle-macos.sh --universal
      - run: cd target/release/bundle && ditto -c -k --keepParent OneScreen.app ../../../OneScreen-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: OneScreen-macOS.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p onescreen
      - run: Compress-Archive -Path target/release/onescreen.exe -DestinationPath OneScreen-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: OneScreen-Windows.zip

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            OneScreen-macOS.zip
            OneScreen-Windows.zip
          generate_release_notes: true
